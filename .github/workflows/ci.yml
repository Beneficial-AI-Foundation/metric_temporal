name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: leanprover/lean-action@v1
        with:
          auto-config: "false"
          build: "true"
          use-mathlib-cache: "false"

      - name: No sorry, admit or axiom in the sources
        run: |
          if grep -rnE '\b(sorry|admit)\b|^\s*axiom\b' --include='*.lean' MetricTemporal MetricTemporal.lean scripts; then
            echo "::error::sorry, admit or axiom found"
            exit 1
          fi

      - name: Axioms of the main theorems
        run: |
          lake env lean scripts/Axioms.lean | tee axioms.txt
          if grep -q sorryAx axioms.txt; then
            echo "::error::a main theorem depends on sorryAx"
            exit 1
          fi
